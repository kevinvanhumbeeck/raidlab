name: reminders

# Sign-up reminders (#59): asks the app every 15 minutes to DM members who haven't signed up for a raid starting
# soon. The app decides who gets what and sends each reminder once. Needs the CRON_SECRET secret (the same value as
# in Vercel) and the SITE_URL variable. Scheduled runs only start once this file is on the default branch, and
# GitHub may start them a few minutes late.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/discord/reminders"
